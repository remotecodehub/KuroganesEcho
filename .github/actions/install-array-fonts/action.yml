name: Install bundled Array fonts
description: Makes the bundled Array fonts available to the MonoGame content pipeline
runs:
  using: composite
  steps:
    - name: Install fonts on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $sourceDirectory = Join-Path $env:GITHUB_WORKSPACE 'src\KuroganesEcho.Core\Content\Fonts\Array'
        $fontDirectory = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\Fonts'
        $registryPath = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
        New-Item -ItemType Directory -Force -Path $fontDirectory | Out-Null
        New-Item -Force -Path $registryPath | Out-Null

        $fontNames = @{
          'Array-Regular.ttf' = 'Array Regular'
          'Array-Semibold.ttf' = 'Array Semibold'
          'Array-Wide.ttf' = 'Array Wide'
          'Array-SemiboldWide.ttf' = 'Array Semibold Wide'
        }

        foreach ($font in Get-ChildItem -LiteralPath $sourceDirectory -Filter '*.ttf') {
          $destination = Join-Path $fontDirectory $font.Name
          Copy-Item -LiteralPath $font.FullName -Destination $destination -Force
          Set-ItemProperty -Path $registryPath -Name "$($fontNames[$font.Name]) (TrueType)" -Value $destination
        }

        Add-Type -TypeDefinition @'
        using System;
        using System.Runtime.InteropServices;
        public static class FontInstallerNativeMethods
        {
            [DllImport("gdi32.dll", CharSet = CharSet.Unicode)]
            public static extern int AddFontResourceEx(string fileName, uint flags, IntPtr reserved);

            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
        }
        '@

        foreach ($font in Get-ChildItem -LiteralPath $fontDirectory -Filter 'Array-*.ttf') {
          $fontCount = [FontInstallerNativeMethods]::AddFontResourceEx($font.FullName, 0, [IntPtr]::Zero)
          if ($fontCount -eq 0) {
            throw "Could not register font '$($font.Name)' for the content pipeline."
          }
        }
        [void][FontInstallerNativeMethods]::SendMessage([IntPtr]0xffff, 0x001D, [IntPtr]::Zero, [IntPtr]::Zero)

    - name: Install fonts on Linux and macOS
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        source_dir="src/KuroganesEcho.Core/Content/Fonts/Array"
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          font_dir="$HOME/Library/Fonts"
        else
          font_dir="$HOME/.local/share/fonts"
        fi
        mkdir -p "$font_dir"
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          cp "$source_dir"/*.ttf "$font_dir/"
          fc-cache -f "$font_dir"
        else
          cp "$source_dir/Array-Regular.ttf" "$font_dir/Array.ttf"
          cp "$source_dir/Array-Semibold.ttf" "$font_dir/Array Semibold.ttf"
          cp "$source_dir/Array-Wide.ttf" "$font_dir/Array Wide.ttf"
          cp "$source_dir/Array-SemiboldWide.ttf" "$font_dir/Array Semibold Wide.ttf"
        fi
