name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktopgl:
    name: Build DesktopGL (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            rid: win-x64
          - platform: linux
            runner: ubuntu-latest
            rid: linux-x64
          - platform: macos
            runner: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Publish DesktopGL
        run: dotnet publish src/KuroganesEcho.DesktopGL/KuroganesEcho.DesktopGL.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/publish

      - name: Upload DesktopGL publish files
        uses: actions/upload-artifact@v4
        with:
          name: desktopgl-${{ matrix.platform }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
            workload: android
            project: src/KuroganesEcho.Android/KuroganesEcho.Android.csproj
            framework: net11.0-android
          - platform: ios
            runner: macos-latest
            workload: ios
            project: src/KuroganesEcho.iOS/KuroganesEcho.iOS.csproj
            framework: net11.0-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install ${{ matrix.platform }} workload
        run: dotnet workload install ${{ matrix.workload }}

      - name: Publish Android APK
        if: matrix.platform == 'android'
        run: dotnet publish ${{ matrix.project }} --configuration Release --framework ${{ matrix.framework }} -p:AndroidPackageFormats=apk

      - name: Build iOS simulator app
        if: matrix.platform == 'ios'
        run: dotnet build ${{ matrix.project }} --configuration Release --framework ${{ matrix.framework }} -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false

      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/KuroganesEcho.Android/bin/Release/net11.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS simulator app
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: src/KuroganesEcho.iOS/bin/Release/net11.0-ios/iossimulator-arm64/*.app
          if-no-files-found: error
          retention-days: 14

  installers:
    name: Package DesktopGL (${{ matrix.platform }})
    needs: desktopgl
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktopgl-${{ matrix.platform }}
          path: artifacts/publish

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $iscc "/DSourceDir=$((Resolve-Path artifacts/publish).Path)" "/DOutputDir=$((Resolve-Path artifacts/installer).Path)" installer/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Linux Debian package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/kuroganes-echo-deb"
          mkdir -p "$package_root/DEBIAN" "$package_root/usr/lib/kuroganes-echo" "$package_root/usr/bin" "$package_root/usr/share/applications" artifacts/installer
          cp -a artifacts/publish/. "$package_root/usr/lib/kuroganes-echo/"
          cat > "$package_root/DEBIAN/control" <<'EOF'
          Package: kuroganes-echo
          Version: 1.0.0
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgcc-s1, libstdc++6, libsdl2-2.0-0, libopenal1, libgl1, libx11-6, libxrandr2, libxi6, libxcursor1, libxinerama1
          Maintainer: KuroganesEcho contributors
          Description: Kuroganes Echo MonoGame DesktopGL game
          EOF
          cat > "$package_root/usr/bin/kuroganes-echo" <<'EOF'
          #!/bin/sh
          exec /usr/lib/kuroganes-echo/KuroganesEcho "$@"
          EOF
          cat > "$package_root/usr/share/applications/kuroganes-echo.desktop" <<'EOF'
          [Desktop Entry]
          Name=Kuroganes Echo
          Comment=Kuroganes Echo game
          Exec=/usr/bin/kuroganes-echo
          Type=Application
          Categories=Game;
          Terminal=false
          EOF
          chmod 755 "$package_root/usr/bin/kuroganes-echo"
          dpkg-deb --build --root-owner-group "$package_root" artifacts/installer/kuroganes-echo-linux-x64.deb

      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_root="$RUNNER_TEMP/pkgroot/Applications/KuroganesEcho.app"
          mkdir -p "$app_root/Contents/MacOS" artifacts/installer
          cp -a artifacts/publish/. "$app_root/Contents/MacOS/"
          cat > "$app_root/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>KuroganesEcho</string>
            <key>CFBundleIdentifier</key>
            <string>com.companyname.KuroganesEcho</string>
            <key>CFBundleName</key>
            <string>Kuroganes Echo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
          </dict>
          </plist>
          EOF
          chmod +x "$app_root/Contents/MacOS/KuroganesEcho"
          pkgbuild --root "$RUNNER_TEMP/pkgroot" --identifier com.companyname.KuroganesEcho --version 1.0.0 --install-location / artifacts/installer/KuroganesEcho-macos-arm64.pkg

      - name: Upload DesktopGL installer
        uses: actions/upload-artifact@v4
        with:
          name: desktopgl-installer-${{ matrix.platform }}
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 30
